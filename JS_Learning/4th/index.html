  <head>

    <title>Document</title>

  <body>
    <input
      type="text"
      id="f"
      autocomplete="off"
      style="width: 300px; height: 40px; margin-top: 10px; text-align: right"

    />

    <input
      type="text"
      id="s"
      autocomplete="off"
      style="width: 300px; height: 40px; margin-top: 10px; text-align: right"

    />

      type="button"
      value="Calculate"
      id="btn"
      style="width: 300px; height: 40px; margin-top: 10px"
      onclick="result()"
    />

    <div
      id="d"
      style="
        background-color: rgb(199, 199, 201);

        height: 40px;
        margin-top: 10px;
        text-align: right;
        border: 1px solid #272626;
      "
    ></div>
