<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="width: 300px; height: 40px; background-color: lightblue">
      Calculator
    </h1>

    <input
      type="text"
      id="f"
      style="width: 300px; height: 40px; margin-top: 10px; text-align: right"
      placeholder="/-"
    />
    <br />
    <input
      type="text"
      id="s"
      style="width: 300px; height: 40px; margin-top: 10px; text-align: right"
      placeholder="/-"
    />
    <hr />
    <input
      type="button"
      value="+"
      class="op"
      style="width: 70px; height: 40px; margin-top: 10px"
    />
    <input
      type="button"
      value="-"
      class="op"
      style="width: 70px; height: 40px; margin-top: 10px"
    />
    <input
      type="button"
      value="*"
      class="op"
      style="width: 70px; height: 40px; margin-top: 10px"
    />
    <input
      type="button"
      value="/"
      class="op"
      style="width: 70px; height: 40px; margin-top: 10px"
    />

    <input
      type="button"
      value="!"
      class="op"
      style="width: 70px; height: 40px; margin-top: 10px"
    />
    <hr />
    <div id="d"></div>
    <script src="script.js"></script>
  </body>
</html>
